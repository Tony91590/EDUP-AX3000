
      - name: Delete ALL Git tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching all Git tags..."

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            echo "Deleting tag: $tag"

            encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')

            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded_tag"

          done

          echo "All Git tags deleted."
