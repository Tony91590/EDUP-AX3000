name: delete-older-releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  actions: write
  contents: write

jobs:
  del_runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          retain_days: 1
          keep_minimum_runs: 0

      - name: Delete old Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching releases..."

          releases=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --order desc \
            --json tagName \
            --jq '.[1:][].tagName')

          if [ -z "$releases" ]; then
            echo "No old releases to delete."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            echo "Deleting release: $tag"

            # Delete release first, without automatic tag cleanup.
            if gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes; then

              echo "Release deleted: $tag"

            else
              echo "Failed to delete release: $tag"
              continue
            fi

            # Check whether the Git tag still exists.
            if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              >/dev/null 2>&1; then

              echo "Deleting tag: $tag"

              gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"

            else
              echo "Tag already absent: $tag"
            fi

          done <<< "$releases"

          echo "Release cleanup completed."
          
