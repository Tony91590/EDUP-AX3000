
name: delete-older-releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  actions: write
  contents: write

jobs:
  del_runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          retain_days: 5
          keep_minimum_runs: 0

      - name: Delete old Releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching releases..."

          releases=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --order desc \
            --json tagName \
            --jq '.[5:][].tagName')

          if [ -z "$releases" ]; then
            echo "No old releases to delete."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            echo "--------------------------------"
            echo "Processing: $tag"

            # Delete release
            if ! gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes; then
              echo "::error::Failed to delete release: $tag"
              exit 1
            fi

            echo "Release deleted: $tag"

            # Delete Git tag reference
            if output=$(gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>&1); then

              echo "Tag deleted: $tag"

            else
              if [[ "$output" == *"Reference does not exist"* ]]; then
                echo "Tag already absent: $tag"
              else
                echo "::error::Failed to delete tag: $tag"
                echo "$output"
                exit 1
              fi
            fi

          done <<< "$releases"

          echo "--------------------------------"
          echo "Release and tag cleanup completed."
